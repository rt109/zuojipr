  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js").then(
          function (registration) {
            console.log("ServiceWorker registration successful");
          },
          function (err) {
            console.log("ServiceWorker registration failed: ", err);
          },
        );
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
	    var yearSelector = document.getElementById('yearSelector');
	    for (var year = 2024; year <= 2044; year++) {
	        var option = document.createElement('option');
	        option.value = year;
			option.text = year + ".8.24";
	        yearSelector.appendChild(option);
	    }
		//dz2
		var hardSelector = document.getElementById('hardSelector');
		for (var hard = 1; hard <= 7; hard++) {
		    var option2 = document.createElement('option');
		    option2.value = hard;
			option2.text = "👻" + hard;
		    hardSelector.appendChild(option2);
		}
	});
window.addEventListener('beforeinstallprompt', e => {
      // Prevent invasive install prompt (users are still able to install as an app)
      e.preventDefault();
    });
  </script>

<body>
	<div id="app"></div>
	<div class="kobeParent">
		<div class="select-wrapper">
			<label for="yearSelector" >&nbsp;&nbsp;&nbsp;选择赛季后点确定:</label>
			<select id="yearSelector">
				<!-- 使用JavaScript动态添加年份选项 -->
			</select>
			  <p id="kobeRecordText1" class="kobeTextClass">门槛：12610</p>
			  <p id="kobeRecordText2" class="kobeTextClass">你的得分纪录：0</p>
			  <p id="kobeRecordText3" class="kobeTextClass">排名：前？%</p>
			  <p id="kobeRecordText4" class="kobeTextClass">无尽起始金：0</p>
			  <p id="kobeRecordText5" class="kobeTextClass">妖梦起始金：0</p>
			  <button id="kobeCancel">取消</button>
			  <button id="kobeAction">确定</button>
		</div>
	</div>
	<!-- //dz2 -->
	<div class="dzParent">
		<div class="select-wrapper">
			<label for="hardSelector" >&nbsp;&nbsp;&nbsp;选个难度点确定:&nbsp;&nbsp;&nbsp;</label>
			  <br>
			<select id="hardSelector">
			</select>
			<br>
			<button id="dzCancel">取消</button>
			<button id="dzAction">确定</button>
			  <p id="dzText1" class="dzTextClass">已通关最高难度：0</p>
			  <p id="dzText2" class="dzTextClass">波数：100</p>
			  <p id="dzText3" class="dzTextClass">训练师双打：❌</p>
			  <p id="dzText4" class="dzTextClass">路闪值增加：0.3</p>
			  <p id="dzText5" class="dzTextClass">闪光护盾数：+0</p>
			  <p id="dzText6" class="dzTextClass">曼巴挑战数：0</p>
			  <p id="dzText7" class="dzTextClass">训练师应激：1</p>
			  <p id="dzText8" class="dzTextClass">无尽硬币+1波数：0</p>
			  <p id="dzText9" class="dzTextClass">防御硬币数：0</p>
			  <p id="dzText10" class="dzTextClass">中心开放间隔：0</p>
		</div>
	</div>
	<!-- //dzm -->
	<div id="missionSelect-container">
		<h4 class="missionSelect-text">请选个曼巴挑战</h2>
		<button class="btn" id="btn1">队伍里有5只指定随机不重复的属性宝可梦</button>
		<button class="btn" id="btn2">队伍里有5只指定随机不重复的属性宝可梦</button>
		<button class="btn" id="btn3">队伍里有5只指定随机不重复的属性宝可梦</button>
		<p class="missionSelect-text">挑战失败将会返回前几波=￣ω￣=</p>
	</div>
	<!-- //dt -->
	<div id="dutu-container">
		<h4 class="dutu-text">毒图模式</h2>
		<p class="dutu-text" id="dutuScore">累计得分：0</p>
		<button class="btn" id="btn4">新建毒图</button>
		<button class="btn" id="btn5">编辑毒图</button>
		<button class="btn" id="btn7">跳到论坛</button>
		<button class="btn" id="btn8">复制论坛链接</button>
		<button class="btn" id="btn6">取消</button>
		<p class="dutu-text">新建毒图会让你选2波精灵，第1敌方第2我方<br>编辑毒图会有部分功能受限<br>新建和编辑后都要自己打赢才能导出<br>然后上传网盘后到论坛学别人发帖分享哈</p>
	</div>
	<div id="formCreate">
	    <form-create :rule="rule" :option="options" v-model="formData" v-model:api="api" @submit="onSubmit" @mounted="handleMounted"></form-create>
	</div>
	<div id="touchControls">
		<div class="left">
			<div id="control-group-dpad" class="control-group control-group-dpad">
				<div id="dpad" data-control-key="DPAD">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
						<path id="dpadUp" data-key="UP"
							d="M48,5.8C48,2.5,45.4,0,42,0H29.9C26.6,0,24,2.4,24,5.8V24h24V5.8z" />
						<path id="dpadRight" data-key="RIGHT"
							d="M66.2,24H48v24h18.2c3.3,0,5.8-2.7,5.8-6V29.9C72,26.5,69.5,24,66.2,24z" />
						<path id="dpadDown" data-key="DOWN"
							d="M24,66.3c0,3.3,2.6,5.7,5.9,5.7H42c3.3,0,6-2.4,6-5.7V48H24V66.3z" />
						<path id="dpadLeft" data-key="LEFT"
							d="M5.7,24C2.4,24,0,26.5,0,29.9V42c0,3.3,2.3,6,5.7,6H24V24H5.7z" />
						<rect id="dpadCenter" x="24" y="24" width="24" height="24" />
					</svg>
				</div>
			</div>
		</div>

		<div class="right">
			<div id="control-group-action" class="control-group">
				<div id="apadAction" class="apad-button apad-circle" data-key="ACTION">
					<span class="apad-label">A</span>
				</div>
			</div>

			<div id="control-group-cancel" class="control-group">
				<div id="apadCancel" class="apad-button apad-circle" data-key="CANCEL">
					<span class="apad-label">B</span>
				</div>
			</div>

			<div id="control-group-extra-1" class="control-group control-group-extra">
				<!-- buttons to navigate settings tabs -->
				<div id="apadPreviousTab" class="apad-button apad-square apad-small" data-key="CYCLE_FORM">
					<span class="apad-label">F</span>
				</div>
				<div id="apadNextTab" class="apad-button apad-square apad-small" data-key="CYCLE_SHINY">
					<span class="apad-label">R</span>
				</div>
				<!-- buttons to open filter menu in starter select -->
				<div id="apadOpenFilters" class="apad-button apad-rectangle apad-small" data-key="STATS">
					<span class="apad-label">C</span>
				</div>
				<!-- main menu button -->
				<div id="apadMenu" class="apad-button apad-rectangle apad-small" data-key="MENU">
					<span class="apad-label">Menu</span>
				</div>
			</div>

			<div id="control-group-extra-2" class="control-group control-group-extra">
				<!-- buttons to cycle through pokemon characteristics in starter select -->
				<div id="apadCycleForm" class="apad-button apad-square apad-small" data-key="CYCLE_FORM">
					<span class="apad-label">F</span>
				</div>
				<div id="apadCycleGender" class="apad-button apad-square apad-small" data-key="CYCLE_GENDER">
					<span class="apad-label">G</span>
				</div>
				<div id="apadCycleShiny" class="apad-button apad-square apad-small" data-key="CYCLE_SHINY">
					<span class="apad-label">R</span>
				</div>
				<div id="apadCycleAbility" class="apad-button apad-square apad-small" data-key="CYCLE_ABILITY">
					<span class="apad-label">E</span>
				</div>
				<div id="apadCycleNature" class="apad-button apad-square apad-small" data-key="CYCLE_NATURE">
					<span class="apad-label">N</span>
				</div>
				<div id="apadCycleTera" class="apad-button apad-square apad-small" data-key="CYCLE_TERA">
					<span class="apad-label">V</span>
				</div>
				<!-- buttons to display battle-specific information -->
				<div id="apadInfo" class="apad-button apad-rectangle apad-small" data-key="CYCLE_TERA">
					<span class="apad-label">V</span>
				</div>
				<div id="apadStats" class="apad-button apad-rectangle apad-small" data-key="STATS">
					<span class="apad-label">C</span>
				</div>
			</div>

		</div>
	</div>
